distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Official services.gradle.org times out from this network (verified 2026-10-13:
> 10s connect timeout). Huawei's mirror served the same 137 MB zip in 276 ms, so
# the wrapper pulls the distribution from there instead.
distributionUrl=https\://mirrors.huaweicloud.com/gradle/gradle-8.14.3-bin.zip
# Raised from the default 10000 ms so a slow first download does not abort.
networkTimeout=60000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
