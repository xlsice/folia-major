apply plugin: 'com.android.application'

// 发布签名。
//
// 密钥与口令都是**秘密，不是对应源码**：AGPL-3.0 §6 只要求源码可被他人重建，不要求（也不应该）
// 附带私钥。所以 android/keystore/ 与 android/keystore.properties 都进了 .gitignore，
// 任何人 clone 下来都拿不到我们的签名材料 —— 这是对的。
//
// 代价是「拿到源码的人能构建，但装不上我们发布的那个包」。解法是这个 fallback：
// 没有 keystore.properties 时 release 构建退回 debug key，产出照样可安装（只是签名不同，
// 与线上包不能互相覆盖）。这样对应源码仍然是**完整可重建**的，这才是 §6 的实际要求。
//
// 自建签名：keytool -genkeypair -keystore android/keystore/folia-release.jks -alias folia \
//            -keyalg RSA -keysize 2048 -validity 10950
// 然后写 android/keystore.properties：
//   storeFile=keystore/folia-release.jks
//   storePassword=...
//   keyAlias=folia
//   keyPassword=...
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKeystore = keystoreProps.getProperty('storeFile') != null

android {
    namespace = "top.izuna.foliamajor"
    // 本机 Android SDK 只安装了 android-36.1 平台，没有 android-36，
    // 直接用 rootProject.ext.compileSdkVersion(=36) 会让 Gradle 报
    // "Failed to find target with hash string 'android-36'"。
    // minorApiLevel 写法与官方示范仓库 folia-sonnet 一致。
    compileSdk {
        version = release(36) { minorApiLevel = 1 }
    }
    defaultConfig {
        applicationId "top.izuna.foliamajor"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 首个对外发布。versionCode 之后只能递增（安卓据此判升级），
        // 与 package.json 的 0.7.19 对齐，别再留着模板默认的 "1.0"。
        versionCode 1
        versionName "0.7.19"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // 有密钥就正式签名，没有就用 debug key —— 见文件头的说明。
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // 2026-10-15：MediaSessionCompat（通知栏/锁屏/耳机键）。
    // 注意：这个实验刻意不引 media3-exoplayer —— 原生侧只做「影子会话」，
    // 发声的仍然是 WebView 里的 HTMLAudioElement。
    implementation "androidx.media:media:$androidxMediaVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
